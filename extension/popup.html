<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeetCode Coach</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0d1117;
      color: #e6edf3;
      font: 14px/1.4 system-ui, sans-serif;
    }
    h1 { margin: 0 0 12px; font-size: 17px; }
    .status { display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #8b949e; }
    .connected .dot { background: #3fb950; }
    .disconnected .dot { background: #f85149; }
    p { margin: 12px 0 0; color: #8b949e; }
    code { color: #58a6ff; }
  </style>
</head>
<body>
  <h1>LeetCode Coach</h1>
  <div id="status" class="status">
    <span class="dot" aria-hidden="true"></span>
    <strong id="label">Checking local server...</strong>
  </div>
  <p id="detail">Expected at <code>127.0.0.1:8765</code>.</p>
  <script src="popup.js"></script>
</body>
</html>
